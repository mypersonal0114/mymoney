<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money</title>
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg: #f4f6f9; --text: #1d2533; --muted: #667085; --brand: #1f3864; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --text: #e7ebf2; --muted: #98a2b3; --brand: #7aa2e3; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
  .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 14px; padding: 24px; text-align: center; }
  .msg img { width: 72px; height: 72px; border-radius: 18px; }
  .msg p { margin: 0; max-width: 320px; color: var(--muted); }
  .msg button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 22px;
                background: var(--brand); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="app" title="My Money" hidden></iframe>

<div class="msg" id="offline" hidden>
  <img src="icon-192.png" alt="">
  <b>No internet connection</b>
  <p>My Money saves straight into your Google Sheet, so it needs to be online.</p>
  <button type="button" id="retry">Try again</button>
</div>

<div class="msg" id="setup" hidden>
  <img src="icon-192.png" alt="">
  <b>App link not set yet</b>
  <p>Open index.html, paste your Apps Script web app link (ending in /exec) into APP_URL, and upload it again.</p>
</div>

<script>
// Your Apps Script web app link, from Deploy > Manage deployments. It must end in /exec.
const APP_URL = 'PASTE_YOUR_EXEC_LINK_HERE';

const frame = document.getElementById('app');
const offline = document.getElementById('offline');
const setup = document.getElementById('setup');

function start() {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP_URL)) {
    setup.hidden = false;
    return;
  }
  if (!navigator.onLine) {
    offline.hidden = false;
    return;
  }
  offline.hidden = true;
  frame.hidden = false;
  if (!frame.src) frame.src = APP_URL;
}

document.getElementById('retry').addEventListener('click', start);
window.addEventListener('online', start);
start();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
