<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1d2533; --muted: #667085; --line: #d9dee7;
    --brand: #1f3864; --brand-text: #ffffff; --soft: #e8edf6;
    --red: #b42318; --red-bg: #fde8e7; --amber: #9a5b00; --amber-bg: #fff4e0; --green: #067647; --green-bg: #e3f6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --card: #1a2029; --text: #e7ebf2; --muted: #98a2b3; --line: #2d3644;
      --brand: #7aa2e3; --brand-text: #0d1420; --soft: #233047;
      --red: #ff8a80; --red-bg: #3a1d1d; --amber: #f5c26b; --amber-bg: #3a2e18; --green: #6fd3a0; --green-bg: #17342a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 96px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 12px; color: var(--muted); }
  .badge { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.red { background: var(--red); color: #fff; }
  .badge.amber { background: var(--amber-bg); color: var(--amber); }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.grey { background: var(--soft); color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .meter { height: 8px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; background: var(--brand); width: 0; }
  .meter.over i { background: var(--red); }
  .split { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .big { font-size: 20px; font-weight: 700; }
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .types button, .seg button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                  border-radius: 8px; padding: 9px 4px; font: inherit; font-size: 14px; }
  .types button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-text); border-color: var(--brand); font-weight: 600; }
  .seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .seg button { padding: 7px 12px; white-space: nowrap; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; color: var(--text); background: var(--card);
                            border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  textarea { min-height: 64px; resize: vertical; }
  .amount { font-size: 24px; font-weight: 600; }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .row2 label { margin-top: 12px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .filters label { margin-top: 0; }
  .filters .wide { grid-column: 1 / -1; }
  .monthbar { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; margin-top: 12px; }
  .monthbar select { text-align: center; text-align-last: center; font-size: 17px; font-weight: 700;
                     background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
  .monthbar .step { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
                    font-size: 24px; line-height: 1; padding: 0; }
  .monthbar .step:disabled { opacity: .35; }
  .sumtools { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .sec { padding: 0; overflow: hidden; }
  .sechead { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
             background: none; border: 0; padding: 14px; font: inherit; color: var(--text); text-align: left; }
  .sechead b { font-size: 16px; }
  .sechead .pm { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--soft); color: var(--brand);
                 font-size: 20px; font-weight: 700; line-height: 30px; text-align: center; }
  .secbody { padding: 0 14px 14px; }
  .secpeek { font-size: 13px; color: var(--muted); font-weight: 400; display: block; }
  [hidden] { display: none !important; }
  .btn { width: 100%; margin-top: 16px; padding: 13px; font-size: 17px; font-weight: 600; border: 0;
         border-radius: 10px; background: var(--brand); color: var(--brand-text); }
  .btn:disabled { opacity: .6; }
  .btn.ghost { background: var(--soft); color: var(--text); }
  .btn.danger { background: var(--red-bg); color: var(--red); }
  .btn.slim { width: auto; margin: 0; padding: 8px 14px; font-size: 14px; }
  .err { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 1em; }
  .editbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--amber-bg);
             color: var(--amber); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list li.tap { cursor: pointer; }
  .what { min-width: 0; font-size: 15px; }
  .what span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { white-space: nowrap; font-weight: 600; text-align: right; }
  .in { color: var(--green); }
  .day { margin-top: 12px; }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 0 2px 4px; }
  .dayhead b { font-size: 14px; }
  .dayhead span { font-size: 12px; color: var(--muted); text-align: right; }
  .day .card { margin-top: 0; padding: 4px 14px; }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .totals div { background: var(--soft); border-radius: 8px; padding: 8px 4px; }
  .totals b { display: block; font-size: 15px; }
  .totals span { font-size: 12px; color: var(--muted); }
  .bar { height: 6px; background: var(--soft); border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--brand); }
  .bar.over i { background: var(--red); }
  details.grp { border-bottom: 1px solid var(--line); padding: 8px 0; }
  details.grp:last-child { border-bottom: 0; }
  details.grp summary { list-style: none; cursor: pointer; }
  details.grp summary::-webkit-details-marker { display: none; }
  .sub { padding: 6px 0 0 12px; font-size: 14px; }
  .sub div { margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .menu button { display: flex; justify-content: space-between; width: 100%; text-align: left; font: inherit; color: var(--text);
                 background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; }
  .menu button:last-child { border-bottom: 0; }
  .back { background: none; border: 0; color: var(--brand); font: inherit; font-weight: 600; padding: 4px 0; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 15px; }
  .switch input { width: 22px; height: 22px; flex: none; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
        display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { background: none; border: 0; font: inherit; font-size: 12px; color: var(--muted); padding: 8px 0 10px; }
  nav button svg { display: block; margin: 0 auto 2px; width: 22px; height: 22px; }
  nav button[aria-current="page"] { color: var(--brand); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--green-bg); color: var(--green);
           border: 1px solid var(--green); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
  .modal .box { background: var(--card); border-radius: 14px; padding: 18px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal .box.alert { border-top: 6px solid var(--red); }
  .modal h2 { margin: 0 0 8px; }
  .modal .box.alert h2 { color: var(--red); }
  .pay { background: var(--soft); border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 14px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .btns .btn { margin: 0; }
  .loading { color: var(--muted); text-align: center; padding: 40px 0; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>My Money</h1><div class="muted" id="todayText"></div></div>
    <span class="badge red" id="overBadge" hidden>Over limit</span>
  </div>

  <div id="loading" class="loading">Loading...</div>

  <!-- ADD -->
  <section id="tab-add" hidden>
    <div class="card" id="meterCard">
      <div class="split muted"><span>Money out this month</span><span>limit Rs <span id="limitText"></span></span></div>
      <div class="split"><span class="big" id="outText"></span><span class="muted" id="leftText"></span></div>
      <div class="meter" id="meter"><i></i></div>
    </div>

    <form class="card" id="form" autocomplete="off">
      <div class="editbar" id="editBar" hidden>
        <span id="editText">Editing entry</span>
        <button type="button" class="btn slim ghost" id="editCancel">Cancel</button>
      </div>
      <div class="types" id="types"></div>

      <label for="amount">Amount (Rs)</label>
      <input id="amount" class="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required>

      <div id="catBox">
        <label for="category">Category</label>
        <select id="category"></select>
      </div>

      <div id="loanBox" hidden>
        <label for="loan">Which loan</label>
        <select id="loan"></select>
      </div>

      <div id="invBox" hidden>
        <label for="investment">Investment</label>
        <select id="investment"></select>
        <div id="newInvBox" hidden>
          <label for="invName">Name of the new investment</label>
          <input id="invName" maxlength="80" placeholder="e.g. NMB fixed deposit 1 year">
          <label for="invPlan">Plan / type (optional)</label>
          <input id="invPlan" maxlength="120" placeholder="e.g. FD 9.5%, SIP monthly">
          <label for="invMaturity">Matures on (optional)</label>
          <input id="invMaturity" type="date">
        </div>
      </div>

      <label for="account" id="accountLabel">Account</label>
      <select id="account"></select>

      <div id="toBox" hidden>
        <label for="toAccount">To account</label>
        <select id="toAccount"></select>
      </div>

      <div class="row2">
        <div><label for="month">Month (BS)</label><select id="month"></select></div>
        <div><label for="day">Day</label><input id="day" type="number" inputmode="numeric" min="1" max="32" required></div>
      </div>

      <label for="remarks">Remarks</label>
      <textarea id="remarks" maxlength="500" required placeholder="What was it for?"></textarea>

      <button class="btn" id="saveBtn" type="submit">Save</button>
      <button class="btn danger" id="deleteBtn" type="button" hidden>Delete this entry</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </section>

  <!-- HISTORY -->
  <section id="tab-history" hidden>
    <div class="monthbar">
      <button type="button" class="step" data-for="hMonth" data-dir="older" aria-label="Previous month">‹</button>
      <select id="hMonth" aria-label="Month"></select>
      <button type="button" class="step" data-for="hMonth" data-dir="newer" aria-label="Next month">›</button>
    </div>
    <div class="card">
      <div class="filters">
        <div><label for="hView">Balance of</label><select id="hView"></select></div>
        <div><label for="hType">Type</label><select id="hType"></select></div>
        <div class="wide"><label for="hSearch">Search</label><input id="hSearch" type="search" placeholder="Remarks, category, bank"></div>
      </div>
      <div class="totals" style="margin-top:12px">
        <div><b class="in" id="hIn"></b><span>Money in</span></div>
        <div><b id="hOut"></b><span>Money out</span></div>
        <div><b id="hNet"></b><span>Net</span></div>
      </div>
      <div class="small" id="hNote" style="margin-top:8px"></div>
    </div>
    <div id="hList"></div>
  </section>

  <!-- SUMMARY -->
  <section id="tab-summary" hidden>
    <div class="monthbar">
      <button type="button" class="step" data-for="sMonth" data-dir="older" aria-label="Previous month">‹</button>
      <select id="sMonth" aria-label="Month"></select>
      <button type="button" class="step" data-for="sMonth" data-dir="newer" aria-label="Next month">›</button>
    </div>
    <div class="sumtools">
      <button type="button" class="btn slim ghost" id="sOpenAll">+ Open all</button>
      <button type="button" class="btn slim ghost" id="sCloseAll">− Close all</button>
    </div>
    <div id="sBody"></div>
  </section>

  <!-- MORE -->
  <section id="tab-more" hidden>
    <div id="moreMenu" class="card menu">
      <button type="button" data-panel="loans">Loans <span>›</span></button>
      <button type="button" data-panel="investments">Investments <span>›</span></button>
      <button type="button" data-panel="manage">Manage lists <span>›</span></button>
      <button type="button" data-panel="download">Download data <span>›</span></button>
      <button type="button" data-panel="alerts">Alert settings <span>›</span></button>
    </div>

    <div id="panel" hidden>
      <button type="button" class="back" id="panelBack">‹ More</button>
      <div id="panelBody"></div>
    </div>
  </section>
</main>

<nav id="nav" hidden>
  <button type="button" data-tab="add" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add</button>
  <button type="button" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>History</button>
  <button type="button" data-tab="summary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Summary</button>
  <button type="button" data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</button>
</nav>

<div class="modal" id="modal" hidden>
  <div class="box" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="btns" id="modalBtns"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const S = { type: 'Expense', editing: null, hist: {}, sum: {}, panel: null };
const $ = id => document.getElementById(id);
const NEW_INV = '__new__';
const NEW_GROUP = '__newgroup__';
const fmt = n => (Number(n) < 0 ? '- ' : '') + 'Rs ' + Math.abs(Number(n || 0)).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const OUT_TYPES = ['Expense', 'Loan payment', 'Investment'];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function fill(select, items, extra) {
  select.replaceChildren();
  items.forEach(v => {
    const o = el('option', typeof v === 'string' ? v : v.label);
    o.value = typeof v === 'string' ? v : v.value;
    select.appendChild(o);
  });
  if (extra) { const o = el('option', extra.label); o.value = extra.value; select.appendChild(o); }
}

/** Like fill, but with an "All ..." choice on top, keeping the current choice when it still exists. */
function fillWithAll(select, items, allLabel) {
  const keep = select.value;
  fill(select, items);
  const o = el('option', allLabel); o.value = '';
  select.insertBefore(o, select.firstChild);
  select.value = [...select.options].some(x => x.value === keep) ? keep : '';
}

/** Selects a value, adding it first if it's no longer offered (e.g. a hidden category on an old entry). */
function pick(select, value) {
  if (value == null || value === '') return;
  if (![...select.options].some(o => o.value === value)) {
    const o = el('option', value + ' (hidden)'); o.value = value; select.appendChild(o);
  }
  select.value = value;
}

function call(fn, ...args) {
  return new Promise((ok, fail) => google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](...args));
}

const monthName = key => (S.months.find(m => m.key === key) || { name: key }).name;
const bsLabel = bs => Number(bs.slice(8, 10)) + ' ' + monthName(bs.slice(0, 7));
const failMsg = err => (err && err.message ? err.message : String(err));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(S.toastTimer);
  S.toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/** Simple dialog. buttons: [{label, cls, value}]; resolves with the clicked value. */
function dialog(title, body, buttons, isAlert) {
  return new Promise(resolve => {
    $('modalBox').className = 'box' + (isAlert ? ' alert' : '');
    $('modalTitle').textContent = title;
    const b = $('modalBody'); b.replaceChildren();
    (Array.isArray(body) ? body : [body]).forEach(x => b.appendChild(typeof x === 'string' ? el('p', x) : x));
    const btns = $('modalBtns'); btns.replaceChildren();
    btns.style.gridTemplateColumns = buttons.length > 1 ? '1fr 1fr' : '1fr';
    buttons.forEach(x => {
      const k = el('button', x.label, 'btn ' + (x.cls || '')); k.type = 'button';
      k.addEventListener('click', () => { $('modal').hidden = true; resolve(x.value); });
      btns.appendChild(k);
    });
    $('modal').hidden = false;
  });
}

/* ---------- header and status ---------- */

function showStatus(out, limit, over) {
  S.monthOut = out; S.limit = limit;
  $('limitText').textContent = Number(limit).toLocaleString('en-IN');
  $('outText').textContent = fmt(out);
  $('leftText').textContent = out > limit ? 'over by ' + fmt(out - limit) : fmt(limit - out) + ' left';
  $('meter').firstElementChild.style.width = (limit > 0 ? Math.min(100, out / limit * 100) : 0) + '%';
  $('meter').classList.toggle('over', !!over);
  $('overBadge').hidden = !over;
}

/** After any change: refresh the header, forget cached views, keep month pickers current. */
function afterChange(st) {
  if (st && st.currentOut != null) showStatus(st.currentOut, st.limit, st.over);
  if (st && st.activeMonths) { S.activeMonths = st.activeMonths; fillMonthPickers(); }
  S.hist = {}; S.sum = {};
}

/* ---------- tabs ---------- */

function showTab(name) {
  ['add', 'history', 'summary', 'more'].forEach(t => { $('tab-' + t).hidden = t !== name; });
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.tab === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  S.tab = name;
  window.scrollTo(0, 0);
  if (name === 'history') loadHistory();
  if (name === 'summary') loadSummary();
  if (name === 'more' && S.panel) openPanel(S.panel);
}

/* ---------- add / edit form ---------- */

function fillGrouped(select, cats) {
  select.replaceChildren();
  const groups = new Map();
  cats.forEach(c => {
    if (!groups.has(c.group)) {
      const g = document.createElement('optgroup');
      g.label = c.group;
      groups.set(c.group, g);
      select.appendChild(g);
    }
    const o = el('option', c.name); o.value = c.name;
    groups.get(c.group).appendChild(o);
  });
}

function setType(t) {
  S.type = t;
  document.querySelectorAll('#types button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === t)));
  const L = S.lists;
  $('catBox').hidden = !(t === 'Expense' || t === 'Income');
  if (t === 'Expense') fillGrouped($('category'), L.expenseGroups);
  if (t === 'Income') fill($('category'), L.incomeCats);
  $('loanBox').hidden = t !== 'Loan payment';
  $('invBox').hidden = t !== 'Investment';
  $('toBox').hidden = t !== 'Transfer';
  $('accountLabel').textContent = t === 'Income' ? 'Received in' : t === 'Transfer' ? 'From account' : 'Paid from';
  toggleNewInv();
}

function toggleNewInv() {
  $('newInvBox').hidden = !(S.type === 'Investment' && $('investment').value === NEW_INV);
}

function setDayMax() {
  const m = S.months.find(x => x.key === $('month').value);
  $('day').max = m ? m.days : 32;
}

function fillInvestments(selected) {
  fill($('investment'), S.lists.investments, { label: '+ New investment', value: NEW_INV });
  $('investment').value = selected || (S.lists.investments.length ? S.lists.investments[0] : NEW_INV);
  toggleNewInv();
}

function fillFormLists() {
  const L = S.lists;
  fill($('account'), L.accounts);
  fill($('toAccount'), L.accounts);
  if (L.accounts.length > 1) $('toAccount').selectedIndex = 1;
  try {
    const last = localStorage.getItem('lastAccount');
    if (last && L.accounts.indexOf(last) >= 0) $('account').value = last;
  } catch (_) {}
  fill($('loan'), L.loans);
  fillInvestments();
  setType(S.type);
}

function resetForm() {
  if (S.editing) S.type = 'Expense'; // after editing, a fresh form starts as an expense
  S.editing = null;
  $('editBar').hidden = true;
  $('deleteBtn').hidden = true;
  $('saveBtn').textContent = 'Save';
  $('meterCard').hidden = false;
  $('amount').value = ''; $('remarks').value = '';
  $('invName').value = ''; $('invPlan').value = ''; $('invMaturity').value = '';
  $('month').value = S.today.key; $('day').value = S.today.day; setDayMax();
  $('err').textContent = '';
  fillFormLists();
}

function openEdit(r) {
  showTab('add');
  S.editing = r;
  $('editBar').hidden = false;
  $('editText').textContent = 'Editing ' + bsLabel(r.bs) + ' entry';
  $('deleteBtn').hidden = false;
  $('saveBtn').textContent = 'Save changes';
  $('meterCard').hidden = true;
  $('err').textContent = '';
  fillFormLists();
  setType(r.type);
  $('amount').value = r.amount;
  if (r.type === 'Expense' || r.type === 'Income') pick($('category'), r.category);
  pick($('account'), r.account);
  if (r.type === 'Transfer') pick($('toAccount'), r.to);
  if (r.type === 'Loan payment') pick($('loan'), r.link);
  if (r.type === 'Investment') { pick($('investment'), r.link); toggleNewInv(); }
  $('month').value = r.bs.slice(0, 7); setDayMax();
  $('day').value = Number(r.bs.slice(8, 10));
  $('remarks').value = r.remarks;
  if (r.review) $('err').textContent = 'Flagged for review: ' + r.review;
}

function formEntry() {
  const t = S.type;
  const e = { type: t, amount: $('amount').value, account: $('account').value, remarks: $('remarks').value,
              month: $('month').value, day: $('day').value };
  if (t === 'Expense' || t === 'Income') e.category = $('category').value;
  if (t === 'Transfer') e.toAccount = $('toAccount').value;
  if (t === 'Loan payment') e.link = $('loan').value;
  if (t === 'Investment') {
    if ($('investment').value === NEW_INV) {
      e.link = $('invName').value; e.plan = $('invPlan').value; e.maturity = $('invMaturity').value;
    } else e.link = $('investment').value;
  }
  if (S.editing) {
    const r = S.editing;
    e.keep = { bank: [r.account, r.to].filter(Boolean), category: [r.category], income: [r.category], loan: [r.link] };
  }
  return e;
}

function showLimitAlert(res) {
  const p = res.saved;
  const what = p.type === 'Expense' || p.type === 'Income' ? p.category : p.type + (p.link ? ': ' + p.link : '');
  const pay = el('div', null, 'pay');
  pay.appendChild(el('div', fmt(p.amount) + ' · ' + what + ' · ' + p.account));
  pay.appendChild(el('div', p.remarks));
  return dialog(res.crossed ? 'You have crossed your monthly limit' : 'Over the monthly limit',
    [pay, res.monthName + ' so far: ' + fmt(res.monthOut) + ', which is ' + fmt(res.overBy) + ' over your ' + fmt(res.limit) + ' limit.'],
    [{ label: 'OK', value: true }], true);
}

function noteNewInvestment(e) {
  if (e.type === 'Investment' && S.lists.investments.indexOf(e.link) < 0) {
    S.lists.investments.push(e.link);
  }
}

async function save(ev) {
  ev.preventDefault();
  $('err').textContent = '';
  const e = formEntry();
  $('saveBtn').disabled = true;
  try {
    if (S.editing) {
      const back = S.editing;
      const res = await call('updateEntry', back.id, e);
      afterChange(res);
      noteNewInvestment(e);
      resetForm();
      toast('Changes saved');
      S.histMonth = back.bs.slice(0, 7);
      showTab('history');
    } else {
      const res = await call('saveEntry', e);
      afterChange(res);
      noteNewInvestment(e);
      try { localStorage.setItem('lastAccount', e.account); } catch (_) {}
      $('amount').value = ''; $('remarks').value = '';
      if (e.type === 'Investment') fillInvestments(e.link);
      $('invName').value = ''; $('invPlan').value = ''; $('invMaturity').value = '';
      if (res.showAlert) await showLimitAlert(res); else toast('Saved');
    }
  } catch (err) {
    $('err').textContent = failMsg(err);
  } finally {
    $('saveBtn').disabled = false;
  }
}

async function removeEntry() {
  const r = S.editing;
  if (!r) return;
  const ok = await dialog('Delete this entry?',
    [fmt(r.amount) + ' · ' + (r.category || r.type) + ' · ' + bsLabel(r.bs), r.remarks, 'This removes it from your sheet too.'],
    [{ label: 'Cancel', cls: 'ghost', value: false }, { label: 'Delete', cls: 'danger', value: true }]);
  if (!ok) return;
  try {
    const res = await call('deleteEntry', r.id);
    afterChange(res);
    resetForm();
    toast('Entry deleted');
    S.histMonth = r.bs.slice(0, 7);
    showTab('history');
  } catch (err) { $('err').textContent = failMsg(err); }
}

/* ---------- history ---------- */

function fillMonthPickers() {
  const opts = S.activeMonths.slice().reverse().map(m => ({ label: m.name, value: m.key }));
  const keepH = $('hMonth').value || S.today.key;
  fill($('hMonth'), opts, { label: 'All months', value: 'all' });
  $('hMonth').value = [...$('hMonth').options].some(o => o.value === keepH) ? keepH : S.today.key;
  const keepS = $('sMonth').value || S.today.key;
  fill($('sMonth'), opts);
  $('sMonth').value = [...$('sMonth').options].some(o => o.value === keepS) ? keepS : S.today.key;
  updateSteps();
}

function effect(r, acct) {
  if (r.type === 'Income') return !acct || r.account === acct ? r.amount : 0;
  if (r.type === 'Transfer') return acct ? (r.to === acct ? r.amount : 0) - (r.account === acct ? r.amount : 0) : 0;
  if (OUT_TYPES.indexOf(r.type) >= 0) return !acct || r.account === acct ? -r.amount : 0;
  return 0;
}

async function loadHistory() {
  if (S.histMonth) {
    if ([...$('hMonth').options].some(o => o.value === S.histMonth)) $('hMonth').value = S.histMonth;
    S.histMonth = null;
    updateSteps();
  }
  const key = $('hMonth').value;
  if (!S.hist[key]) {
    $('hList').replaceChildren(el('div', 'Loading...', 'loading'));
    try { S.hist[key] = await call('getHistory', key); }
    catch (err) { $('hList').replaceChildren(el('div', failMsg(err), 'err')); return; }
  }
  renderHistory();
}

function renderHistory() {
  const h = S.hist[$('hMonth').value];
  if (!h) return;
  const view = $('hView').value;
  const q = $('hSearch').value.trim().toLowerCase();
  const ty = $('hType').value;
  const sumOpen = Object.keys(h.openings).reduce((a, k) => a + h.openings[k], 0);
  let bal = view ? (h.openings[view] || 0) : sumOpen;

  const days = [];
  let cur = null, inT = 0, outT = 0;
  h.rows.forEach(r => {
    if (view && r.account !== view && r.to !== view) return;
    if (!cur || cur.bs !== r.bs) { cur = { bs: r.bs, rows: [], open: null, close: null }; days.push(cur); }
    const fx = effect(r, view);
    if (r.inBalance) {
      if (cur.open == null) cur.open = bal;
      bal += fx; cur.close = bal;
    }
    if (fx > 0) inT += fx;
    if (fx < 0) outT -= fx;
    cur.rows.push(r);
  });
  $('hIn').textContent = fmt(inT);
  $('hOut').textContent = fmt(outT);
  $('hNet').textContent = (inT - outT < 0 ? '- ' : '') + fmt(Math.abs(inT - outT));
  $('hNote').textContent = 'Balances count from ' + bsLabel(h.balanceStart) +
    (view ? ', for ' + view : ', all accounts together') + '. Change the start date under More > Manage lists > Banks.';

  const list = $('hList');
  list.replaceChildren();
  let shown = 0;
  days.slice().reverse().forEach(d => {
    const rows = d.rows.filter(r => (!ty || r.type === ty) &&
      (!q || [r.remarks, r.category, r.link, r.account, r.to].join(' ').toLowerCase().indexOf(q) >= 0));
    if (!rows.length) return;
    shown += rows.length;
    const box = el('div', null, 'day');
    const head = el('div', null, 'dayhead');
    head.appendChild(el('b', bsLabel(d.bs)));
    head.appendChild(el('span', d.open == null ? 'before balance start' : 'Opening ' + fmt(d.open) + '  →  Closing ' + fmt(d.close)));
    box.appendChild(head);
    const card = el('div', null, 'card');
    const ul = el('ul', null, 'list');
    rows.slice().reverse().forEach(r => ul.appendChild(entryItem(r, view)));
    card.appendChild(ul);
    box.appendChild(card);
    list.appendChild(box);
  });
  if (!shown) list.appendChild(el('div', 'No entries for this choice.', 'empty'));
}

function entryItem(r, view) {
  const li = el('li', null, 'tap');
  const what = el('div', null, 'what');
  const title = r.type === 'Expense' || r.type === 'Income' ? r.category : r.type + (r.link ? ': ' + r.link : '');
  what.appendChild(document.createTextNode(title));
  if (r.review) { const b = el('span', 'Review', 'badge amber'); b.style.display = 'inline'; b.style.marginLeft = '6px'; what.appendChild(b); }
  what.appendChild(el('span', (r.type === 'Transfer' ? r.account + ' → ' + r.to : r.account) + (r.remarks ? ' · ' + r.remarks : '')));
  li.appendChild(what);
  const fx = effect(r, view);
  const sign = r.type === 'Transfer' && !view ? '↔ ' : fx > 0 ? '+ ' : '- ';
  li.appendChild(el('div', sign + fmt(r.amount), 'amt' + (fx > 0 ? ' in' : '')));
  li.addEventListener('click', () => openEdit(r));
  return li;
}

async function loadSummary() {

function barRow(label, spent, budget) {

/* Which Summary sections are open; remembered on this phone. */
const SECTIONS = ['overview', 'groups', 'banks', 'months'];
function loadOpen() {
  try { return Object.assign({ overview: true, groups: true, banks: true, months: true }, JSON.parse(localStorage.getItem('sumOpen') || '{}')); }
  catch (_) { return { overview: true, groups: true, banks: true, months: true }; }
}
function saveOpen() {

}

/** A Summary card with a + / − button. When closed it shows one line (peek) instead of the report. */
function section(key, title, peek, build) {
  const card = el('div', null, 'card sec');
  const head = el('button', null, 'sechead'); head.type = 'button';
  const left = el('div');
  left.appendChild(el('b', title));
  const pk = el('span', peek, 'secpeek');
  left.appendChild(pk);
  const pm = el('span', null, 'pm');
  head.appendChild(left); head.appendChild(pm);
  const body = el('div', null, 'secbody');
  build(body);
  const apply = () => {
    const open = S.open[key] !== false;
    body.hidden = !open; pk.hidden = open;
    pm.textContent = open ? '−' : '+';
    head.setAttribute('aria-expanded', String(open));
    head.setAttribute('aria-label', (open ? 'Close ' : 'Open ') + title);
  };
  head.addEventListener('click', () => { S.open[key] = S.open[key] === false; saveOpen(); apply(); });
  apply();
  card.appendChild(head); card.appendChild(body);
  return card;
}

function setAllSections(open) {
  SECTIONS.forEach(k => { S.open[k] = open; });

function renderSummary(s) {
  const body = $('sBody');
  body.replaceChildren();
  const net = s.income - s.out;
  const overText = s.out > s.limit ? 'over by ' + fmt(s.out - s.limit) : fmt(s.limit - s.out) + ' left';

  body.appendChild(section('overview', s.monthName, fmt(s.out) + ' out · ' + overText, b => {
    const t = el('div', null, 'split');
    t.appendChild(el('span', 'Money out', 'muted'));
    t.appendChild(el('span', overText + ' of ' + fmt(s.limit), 'muted'));
    b.appendChild(t);
    b.appendChild(el('div', fmt(s.out), 'big'));
    const m = el('div', null, 'meter' + (s.out > s.limit ? ' over' : ''));
    const mi = el('i'); mi.style.width = (s.limit ? Math.min(100, s.out / s.limit * 100) : 0) + '%';
    m.appendChild(mi); b.appendChild(m);
    const tot = el('div', null, 'totals'); tot.style.marginTop = '12px';
    [[fmt(s.income), 'Income', 'in'], [fmt(s.expense), 'Expenses', ''], [(net < 0 ? '- ' : '') + fmt(Math.abs(net)), 'Income − out', '']].forEach(x => {
      const d = el('div'); d.appendChild(el('b', x[0], x[2])); d.appendChild(el('span', x[1])); tot.appendChild(d);
    });
    b.appendChild(tot);
    const t2 = el('div', null, 'small'); t2.style.marginTop = '8px';
    t2.textContent = 'Loan payments ' + fmt(s.loan) + ' · Investments ' + fmt(s.investment);
    b.appendChild(t2);
  }));

  const spentAll = s.groups.reduce((a, g) => a + g.spent, 0);
  const budgetAll = s.groups.reduce((a, g) => a + g.budget, 0);
  body.appendChild(section('groups', 'Spending by group', fmt(spentAll) + (budgetAll ? ' of ' + fmt(budgetAll) + ' budget' : ''), b => {
    b.appendChild(el('div', 'Tap a group to see its categories.', 'small'));
    if (!s.groups.length) b.appendChild(el('div', 'No spending this month.', 'empty'));
    s.groups.forEach(g => {
      const d = el('details', null, 'grp');
      const sm = el('summary');
      sm.appendChild(barRow(g.group, g.spent, g.budget));
      d.appendChild(sm);
      const sub = el('div', null, 'sub');
      if (!g.items.some(i => i.spent)) sub.appendChild(el('div', 'Nothing spent yet.', 'small'));
      g.items.forEach(i => sub.appendChild(barRow(i.name, i.spent, i.budget)));
      d.appendChild(sub);
      b.appendChild(d);
    });
  }));

  const all = s.banks.reduce((a, x) => a + x.balance, 0);
  body.appendChild(section('banks', 'Bank balances now', 'All accounts ' + fmt(all), b => {
    const ul = el('ul', null, 'list');
    s.banks.forEach(x => {
      const li = el('li'); li.appendChild(el('div', x.name, 'what')); li.appendChild(el('div', fmt(x.balance), 'amt')); ul.appendChild(li);
    });
    const li = el('li'); li.appendChild(el('b', 'All accounts')); li.appendChild(el('b', fmt(all))); ul.appendChild(li);
    b.appendChild(ul);
    b.appendChild(el('div', 'Counted from your balances on ' + bsLabel(s.balanceStart) + '.', 'small'));
  }));

  body.appendChild(section('months', 'Month by month', s.months.length + ' months', b => {
    const tb = el('table');
    const hr = el('tr');
    ['Month', 'Income', 'Out', ''].forEach(h => hr.appendChild(el('th', h)));
    tb.appendChild(hr);
    s.months.forEach(r => {
      const tr = el('tr');
      tr.appendChild(el('td', r.name));
      tr.appendChild(el('td', Math.round(r.income).toLocaleString('en-IN')));
      tr.appendChild(el('td', Math.round(r.out).toLocaleString('en-IN')));
      const f = el('td'); if (r.out > s.limit) f.appendChild(el('span', 'Over', 'badge red'));
      tr.appendChild(f);
      tb.appendChild(tr);
    });
    b.appendChild(tb);
  }));
}

/* ---------- month bar ‹ › ---------- */

/** Steps a month picker one month older or newer. Picker options run newest first; "All months" is skipped. */
function stepMonth(id, dir) {
  const sel = $(id);
  const opts = [...sel.options].filter(o => o.value !== 'all');
  let i = opts.findIndex(o => o.value === sel.value);
  const j = i < 0 ? 0 : dir === 'older' ? i + 1 : i - 1;
  if (j < 0 || j >= opts.length) return;
  sel.value = opts[j].value;
  sel.dispatchEvent(new Event('change'));
}

function updateSteps() {
  document.querySelectorAll('.monthbar .step').forEach(b => {
    const sel = $(b.dataset.for);
    const opts = [...sel.options].filter(o => o.value !== 'all');
    const i = opts.findIndex(o => o.value === sel.value);
    b.disabled = i < 0 ? false : b.dataset.dir === 'older' ? i >= opts.length - 1 : i <= 0;
  });
}

function renderManage() {

function itemDetail(kind, it) {
  if (kind === 'category') return it.group + (it.budget ? ' · budget ' + fmt(it.budget) : '');
  if (kind === 'bank') return 'Start balance ' + fmt(it.opening);
  if (kind === 'loan') return 'Total ' + fmt(it.total) + ' · paid before ' + fmt(it.paidBefore);
  if (kind === 'investment') return [it.plan, it.bank, it.maturity ? 'matures ' + it.maturity : ''].filter(Boolean).join(' · ');
  return '';
}

function startDateCard() {
  const c = el('div', null, 'card');
  c.appendChild(el('h2', 'Balances start on'));
  c.appendChild(el('div', 'Each bank\'s start balance below is what was in it on this day. Daily opening and closing balances count from here.', 'small'));
  const bs = S.manage.balanceStart;
  const row = el('div', null, 'row2'); row.style.marginTop = '10px';
  const mSel = el('select');
  fill(mSel, S.months.map(m => ({ label: m.name, value: m.key })));
  mSel.value = bs.slice(0, 7);
  const dIn = textIn(Number(bs.slice(8, 10)), { type: 'number', min: 1, max: 32, inputMode: 'numeric' });
  const mWrap = el('div'); mWrap.appendChild(mSel);
  const dWrap = el('div'); dWrap.appendChild(dIn);
  row.appendChild(mWrap); row.appendChild(dWrap);
  c.appendChild(row);
  const btn = el('button', 'Save start date', 'btn ghost'); btn.type = 'button';
  const err = el('div', null, 'err');
  btn.addEventListener('click', async () => {
    err.textContent = '';
    try {
      const v = mSel.value + '-' + ('0' + Math.floor(Number(dIn.value))).slice(-2);
      const r = await call('setBalanceStart', v);
      S.manage = r.manage; S.balanceStart = v; afterChange(null);
      toast('Start date saved'); renderManage();
    } catch (e) { err.textContent = failMsg(e); }
  });
  c.appendChild(btn); c.appendChild(err);
  return c;
}

function field(form, label, input) {
  form.appendChild(el('label', label)); form.appendChild(input); return input;
}
function textIn(value, attrs) {
  const i = el('input'); i.value = value == null ? '' : value;
  Object.assign(i, attrs || {}); return i;
}

function editItem(kind, it) {
  const isNew = !it;
  it = it || {};
  const form = el('div');
  const name = field(form, 'Name', textIn(it.name, { maxLength: kind === 'loan' || kind === 'investment' ? 80 : 40 }));
  const f = {};
  if (kind === 'category') {
    const groups = [...new Set(S.manage.category.map(c => c.group))];
    f.group = el('select');
    fill(f.group, groups, { label: '+ New group', value: NEW_GROUP });
    f.group.value = it.group || groups[0] || NEW_GROUP;
    field(form, 'Group', f.group);
    f.newGroup = textIn('', { placeholder: 'New group name', maxLength: 40 });
    f.newGroup.style.marginTop = '8px';
    form.appendChild(f.newGroup);
    const tg = () => { f.newGroup.hidden = f.group.value !== NEW_GROUP; };
    f.group.addEventListener('change', tg); tg();
    f.budget = field(form, 'Monthly budget (Rs, optional)', textIn(it.budget || '', { type: 'number', min: 0, inputMode: 'numeric' }));
  } else if (kind === 'bank') {
    f.opening = field(form, 'Balance on ' + bsLabel(S.manage.balanceStart) + ' (Rs)', textIn(it.opening || '', { type: 'number', inputMode: 'decimal' }));
  } else if (kind === 'loan') {
    f.borrowed = field(form, 'Borrowed on (BS, e.g. 2083-07-15)', textIn(it.borrowed, { maxLength: 10, placeholder: '2083-07-15' }));
    f.total = field(form, 'Total dues (Rs)', textIn(it.total || '', { type: 'number', min: 0, inputMode: 'numeric' }));
    f.paidBefore = field(form, 'Already paid before the app (Rs)', textIn(it.paidBefore || '', { type: 'number', min: 0, inputMode: 'numeric' }));
    f.plan = field(form, 'Status / plan', textIn(it.plan, { maxLength: 120 }));
  } else if (kind === 'investment') {
    f.plan = field(form, 'Plan / type', textIn(it.plan, { maxLength: 120 }));
    f.bank = el('select'); fill(f.bank, S.manage.bank.map(b => b.name)); if (it.bank) pick(f.bank, it.bank); field(form, 'Bank', f.bank);
    f.start = el('select'); fill(f.start, S.months.map(m => ({ label: m.name, value: m.key }))); f.start.value = it.start || S.today.key; field(form, 'Started (BS month)', f.start);
    f.maturity = field(form, 'Matures on', textIn(it.maturity, { type: 'date' }));
    f.notes = field(form, 'Notes', textIn(it.notes, { maxLength: 200 }));
  }
  let hide = null;
  if (!isNew) {
    const sw = el('label', null, 'switch');
    sw.appendChild(el('span', 'Hide from the lists'));
    hide = el('input'); hide.type = 'checkbox'; hide.checked = !!it.hidden; sw.appendChild(hide);
    form.appendChild(sw);
  }
  const renameNote = el('div', null, 'small'); renameNote.style.marginTop = '8px'; form.appendChild(renameNote);
  if (!isNew) name.addEventListener('input', () => {
    renameNote.textContent = name.value.trim() && name.value.trim() !== it.name ? 'Past entries using "' + it.name + '" will be renamed too.' : '';
  });
  const err = el('div', null, 'err'); form.appendChild(err);

  const label = KINDS.find(k => k[0] === kind)[2];
  $('modalBox').className = 'box';
  $('modalTitle').textContent = (isNew ? 'Add ' : 'Edit ') + label;
  $('modalBody').replaceChildren(form);
  const btns = $('modalBtns'); btns.replaceChildren(); btns.style.gridTemplateColumns = '1fr 1fr';
  const cancel = el('button', 'Cancel', 'btn ghost'); cancel.type = 'button';
  cancel.addEventListener('click', () => { $('modal').hidden = true; });
  const ok = el('button', 'Save', 'btn'); ok.type = 'button';
  ok.addEventListener('click', async () => {
    err.textContent = '';
    const p = { kind: kind, original: isNew ? '' : it.name, name: name.value, hidden: hide ? hide.checked : false };
    if (kind === 'category') { p.group = f.group.value === NEW_GROUP ? f.newGroup.value : f.group.value; p.budget = f.budget.value; }
    if (kind === 'bank') p.opening = f.opening.value;
    if (kind === 'loan') Object.assign(p, { borrowed: f.borrowed.value, total: f.total.value, paidBefore: f.paidBefore.value, plan: f.plan.value });
    if (kind === 'investment') Object.assign(p, { plan: f.plan.value, bank: f.bank.value, start: f.start.value, maturity: f.maturity.value, notes: f.notes.value });
    ok.disabled = true;
    try {
      const r = await call('saveListItem', p);
      S.manage = r.manage; S.lists = r.lists;
      afterChange(null);
      if (!S.editing) fillFormLists();
      fillWithAll($('hView'), S.lists.all.bank, 'All accounts');
      $('modal').hidden = true;
      toast('Saved');
      renderManage();
    } catch (e) { err.textContent = failMsg(e); }
    finally { ok.disabled = false; }
  });
  btns.appendChild(cancel); btns.appendChild(ok);
  $('modal').hidden = false;
  name.focus();
}

/* ---------- more: download ---------- */

function renderDownload() {
  const body = $('panelBody'); body.replaceChildren();
  const c = el('div', null, 'card');
  c.appendChild(el('h2', 'Entries as a CSV file'));
  c.appendChild(el('div', 'Opens in Excel or Google Sheets. One row per entry, with remarks.', 'small'));
  const sel = el('select'); sel.style.marginTop = '10px';
  fill(sel, S.activeMonths.slice().reverse().map(m => ({ label: m.name, value: m.key })), { label: 'All months', value: 'all' });
  sel.value = S.today.key;
  c.appendChild(sel);
  const b1 = el('button', 'Download CSV', 'btn'); b1.type = 'button';
  const e1 = el('div', null, 'small'); e1.style.marginTop = '8px';
  b1.addEventListener('click', async () => {
    b1.disabled = true;
    try {
      const r = await call('getCsv', sel.value);
      const blob = new Blob(['﻿' + r.csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = r.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      e1.textContent = 'If nothing downloaded, use the Excel button below.';
    } catch (err) { e1.textContent = failMsg(err); }
    finally { b1.disabled = false; }
  });
  c.appendChild(b1); c.appendChild(e1);
  body.appendChild(c);

  const c2 = el('div', null, 'card');
  c2.appendChild(el('h2', 'Everything as Excel'));
  c2.appendChild(el('div', 'The whole sheet as an .xlsx file: entries, banks, loans, investments and budgets. It opens in a new tab and downloads from there.', 'small'));
  const b2 = el('button', 'Download Excel', 'btn ghost'); b2.type = 'button';
  const e2 = el('div', null, 'err');
  b2.addEventListener('click', async () => {
    try { const url = await call('getExcelUrl'); window.open(url, '_blank'); }
    catch (err) { e2.textContent = failMsg(err); }
  });
  c2.appendChild(b2); c2.appendChild(e2);
  body.appendChild(c2);
}

/* ---------- more: alerts ---------- */

function renderAlerts() {
  const body = $('panelBody'); body.replaceChildren();
  const c = el('div', null, 'card');
  c.appendChild(el('h2', 'Alert settings'));
  const sw = el('label', null, 'switch');
  sw.appendChild(el('span', 'Alert me on every payment once I\'m over the limit'));
  const chk = el('input'); chk.type = 'checkbox'; chk.checked = S.alertOn; sw.appendChild(chk);
  c.appendChild(sw);
  c.appendChild(el('div', 'When this is off you still get one alert: on the payment that first takes the month over the limit.', 'small'));
  const err = el('div', null, 'err');
  chk.addEventListener('change', async () => {
    err.textContent = '';
    try { await call('setAlert', chk.checked); S.alertOn = chk.checked; toast(chk.checked ? 'Alerts on' : 'Alerts off'); }
    catch (e) { chk.checked = !chk.checked; err.textContent = failMsg(e); }
  });
  const lim = field(c, 'Monthly limit (Rs)', textIn(S.limit, { type: 'number', min: 1, inputMode: 'numeric' }));
  const b = el('button', 'Save limit', 'btn ghost'); b.type = 'button';
  b.addEventListener('click', async () => {
    err.textContent = '';
    try { const r = await call('setLimit', lim.value); afterChange(r); toast('Limit saved'); }
    catch (e) { err.textContent = failMsg(e); }
  });
  c.appendChild(b); c.appendChild(err);
  body.appendChild(c);
}

/* ---------- start ---------- */

async function init() {
  try {
    const d = await call('getInit');
    S.lists = d.lists; S.months = d.months; S.activeMonths = d.activeMonths; S.today = d.today;
    S.alertOn = d.alertOn; S.balanceStart = d.balanceStart;
    d.lists.types.forEach(t => {
      const b = el('button', t); b.type = 'button'; b.dataset.type = t;
      b.addEventListener('click', () => setType(t));
      $('types').appendChild(b);
    });
    fill($('month'), d.months.map(m => ({ label: m.name + (m.key > d.today.key ? ' (future)' : ''), value: m.key })));
    fillWithAll($('hView'), d.lists.all.bank, 'All accounts');
    fillWithAll($('hType'), d.lists.types, 'All types');
    fillMonthPickers();
    $('todayText').textContent = d.today.name + ', day ' + d.today.day;
    showStatus(d.monthOut, d.limit, d.over);
    resetForm();
    $('loading').hidden = true;
    $('nav').hidden = false;
    showTab('add');
  } catch (err) {
    $('loading').textContent = 'Could not load: ' + failMsg(err);
  }
}

$('form').addEventListener('submit', save);
$('investment').addEventListener('change', toggleNewInv);
$('month').addEventListener('change', setDayMax);
$('editCancel').addEventListener('click', () => {
  const r = S.editing; resetForm();
  if (r) { S.histMonth = r.bs.slice(0, 7); showTab('history'); }
});
$('deleteBtn').addEventListener('click', removeEntry);
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.tab === 'more' && S.tab === 'more') closePanel();
  if (b.dataset.tab !== 'add' && S.editing) resetForm();
  showTab(b.dataset.tab);
}));
S.open = loadOpen();
$('hMonth').addEventListener('change', () => { updateSteps(); loadHistory(); });
document.querySelectorAll('.monthbar .step').forEach(b => b.addEventListener('click', () => stepMonth(b.dataset.for, b.dataset.dir)));
$('sOpenAll').addEventListener('click', () => setAllSections(true));
$('sCloseAll').addEventListener('click', () => setAllSections(false));
['hView', 'hType'].forEach(id => $(id).addEventListener('change', renderHistory));
$('hSearch').addEventListener('input', renderHistory);
$('sMonth').addEventListener('change', () => { updateSteps(); loadSummary(); });
document.querySelectorAll('#moreMenu button').forEach(b => b.addEventListener('click', () => openPanel(b.dataset.panel)));
$('panelBack').addEventListener('click', closePanel);
init();
</script>
